[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aristophanis-cantica"
version = "1.0.0"
description = "Analysis utilities and plotting code for Aristophanic responsion accent compatibility"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
  "cycler>=0.12",
  "grc-utils",
  "lxml>=4.9",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "scipy>=1.10",
  "tqdm>=4.66"
]
authors = [
  { name = "Albin Thörn Cleland" }
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["aristophanis_cantica*"]
exclude = ["data*", "media*", "logs*", "sanity_check*", "scripts*"]
